services:
  muse2api:
    build: .
    image: muse2api:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MUSE2API_HOST: 0.0.0.0
      MUSE2API_DATA_DIR: /app/data
      MUSE2API_CHROMIUM_PATH: /usr/bin/chromium
    ports:
      - "127.0.0.1:18610:18610"
    volumes:
      - ./data:/app/data
    shm_size: "1gb"
