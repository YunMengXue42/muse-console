name: Container image

# Publishes ghcr.io/<owner>/muse-console for linux/amd64 and linux/arm64.
# Tags v1.2.3 -> 1.2.3, 1.2, latest. Pull requests only build and smoke-test.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
      - pyproject.toml
      - uv.lock
      - src/**
      - frontend/**
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image (tag edge)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' || inputs.push }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muse-console" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build native image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: muse-console:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (default browser driver, no network)
        run: |
          set -euo pipefail
          trap 'docker logs muse-console-smoke 2>&1 | tail -40; docker rm -f muse-console-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name muse-console-smoke --network none --shm-size 1g \
            -e MUSE_CONSOLE_KEEPALIVE_ENABLED=false muse-console:smoke
          for attempt in $(seq 1 60); do
            if docker exec muse-console-smoke python -c 'import json,urllib.request; d=json.load(urllib.request.urlopen("http://127.0.0.1:18610/readyz", timeout=2)); assert d["driver"]["ok"] is True, d'; then
              ok=1; break
            fi
            sleep 1
          done
          test "${ok:-}" = 1
          docker logs muse-console-smoke 2>&1 | grep -q "First start: generated an API key"
          docker logs muse-console-smoke 2>&1 | grep -q "Console: http://127.0.0.1:18610/dashboard"
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
