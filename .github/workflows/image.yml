name: Container image

# Release tags (including v0.4.4) require matching project metadata and main CI.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
      - .github/workflows/ci.yml
      - pyproject.toml
      - uv.lock
      - src/**
      - frontend/**
      - '*compose*.yml'
      - '*compose*.yaml'
      - tools/**
      - tests/test_image_workflow.py
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image (edge unless release_tag is set; requires main CI)"
        type: boolean
        default: false
      release_tag:
        description: "Existing stable tag to publish; empty means edge"
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      tag_object: ${{ steps.resolve.outputs.tag_object }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/github-script@v7
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_PUSH: ${{ inputs.push }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const requested = process.env.REQUESTED_TAG || '';
            if (requested && (context.eventName !== 'workflow_dispatch' || process.env.REQUESTED_PUSH !== 'true')) {
              throw new Error('release_tag requires an explicit manual push=true');
            }
            const tag = context.eventName === 'push' ? context.ref.replace(/^refs\/tags\//, '') : requested;
            if (tag && (tag.trim() !== tag || !/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag))) {
              throw new Error('release_tag must be an exact stable vX.Y.Z tag');
            }
            let sha = context.sha;
            let object = '';
            if (tag) {
              const before = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              if (!['tag', 'commit'].includes(before.data.object.type)) throw new Error('Invalid tag object type');
              object = before.data.object.sha;
              if (!/^[0-9a-f]{40}$/.test(object)) throw new Error('Invalid tag object SHA');
              // Full ref is essential; bare tags/... is not a commit API ref.
              sha = (await github.rest.repos.getCommit({owner, repo, ref: `refs/tags/${tag}`})).data.sha;
              const after = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              if (after.data.object.sha !== object || after.data.object.type !== before.data.object.type) {
                throw new Error('Tag changed during resolution');
              }
              if (context.eventName === 'push' && sha !== context.sha) throw new Error('Tag differs from push SHA');
            }
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid source commit SHA');
            core.setOutput('tag', tag);
            core.setOutput('tag_object', object);
            core.setOutput('source_sha', sha);
            core.setOutput('image_tag', tag ? tag.slice(1) : 'edge');
            core.setOutput('release', tag ? 'true' : 'false');

  smoke:
    needs: resolve
    name: Native browser smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - name: Build and load native image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: muse-console:smoke
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Offline browser, isolation and persistent-key smoke
        run: python tools/container_smoke.py --image muse-console:smoke --arch '${{ matrix.arch }}'

  release-gate:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true)
    needs: [resolve, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact stable tag and matching project version
        if: needs.resolve.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or tag != 'v' + version:
              raise SystemExit('Release tag must exactly match the stable pyproject version')
          PY
      - name: Verify current ref SHA and successful main push CI via GitHub API
        id: gate
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          TAG_OBJECT: ${{ needs.resolve.outputs.tag_object }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = (await exec.getExecOutput('git', ['rev-parse', 'HEAD'])).stdout.trim();
            if (sha !== process.env.SOURCE_SHA) throw new Error('Checkout differs from resolved SHA');
            const tag = process.env.RELEASE_TAG;
            if (tag) {
              const current = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              const commit = await github.rest.repos.getCommit({owner, repo, ref: `refs/tags/${tag}`});
              const after = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              if (current.data.object.sha !== process.env.TAG_OBJECT ||
                  after.data.object.sha !== process.env.TAG_OBJECT || commit.data.sha !== sha) {
                throw new Error('Release tag moved since resolution');
              }
            }
            const ancestry = await github.rest.repos.compareCommits({
              owner, repo, base: sha, head: 'main'
            });
            if (!['ahead', 'identical'].includes(ancestry.data.status)) {
              throw new Error('Publishing SHA must belong to main history');
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'ci.yml', branch: 'main', event: 'push',
              head_sha: sha, per_page: 100
            });
            const matching = runs.filter(run => run.head_sha === sha &&
              run.head_branch === 'main' && run.event === 'push' &&
              run.head_repository?.full_name === `${owner}/${repo}`);
            matching.sort((a, b) => b.id - a.id);
            const latest = matching[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error('Latest main push CI for this exact SHA must be completed successfully');
            }

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true)
    needs: [resolve, smoke, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muse-console" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.image_tag }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/tree/${{ needs.resolve.outputs.source_sha }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }},enable=${{ needs.resolve.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }},enable=${{ needs.resolve.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.release == 'true' }}
            type=raw,value=edge,enable=${{ needs.resolve.outputs.release == 'false' }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push multi-architecture image after both native smokes and CI gate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64
      - name: Verify manifest is anonymously readable (no Docker credentials)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          # Do not read ~/.docker/config.json or send GITHUB_TOKEN/basic auth.
          image = os.environ['IMAGE'].removeprefix('ghcr.io/')
          tag = os.environ['IMAGE_TAG']
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{image}:pull'})
          try:
              with opener.open('https://ghcr.io/token?' + query, timeout=30) as response:
                  token = json.load(response)['token']
              request = urllib.request.Request(
                  f'https://ghcr.io/v2/{image}/manifests/{tag}',
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json',
                  },
              )
              with opener.open(request, timeout=30) as response:
                  manifest = json.load(response)
              platforms = {(m['platform']['os'], m['platform']['architecture'])
                           for m in manifest['manifests']}
              assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms
          except Exception:
              raise SystemExit(
                  'Anonymous multi-arch manifest acceptance FAILED. Image may already be pushed but private; '
                  'publication acceptance remains incomplete. Check GHCR package visibility in the documented UI '
                  'and repeat anonymous verification; this workflow never changes visibility.'
              ) from None
          print('PASS: anonymous GHCR manifest exposes linux/amd64 and linux/arm64')
          PY

  anonymous-pull-smoke:
    name: Anonymous published-image smoke (${{ matrix.arch }})
    needs: [resolve, publish, release-gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No login action, packages permission, registry secret or build/push here.
      - name: Full anonymous native pull, then offline container acceptance
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile

          owner = os.environ['IMAGE_OWNER'].lower()
          tag = os.environ['IMAGE_TAG']
          image = f'ghcr.io/{owner}/muse-console:{tag}'
          arch = os.environ['IMAGE_ARCH']
          # Fresh job/daemon and explicit pull download the published layers,
          # rather than reusing the build job's locally loaded smoke image.
          with tempfile.TemporaryDirectory(prefix='muse-anonymous-docker-') as config:
              env = dict(os.environ, DOCKER_CONFIG=config)
              env.pop('DOCKER_AUTH_CONFIG', None)
              env.pop('REGISTRY_AUTH_FILE', None)
              try:
                  subprocess.run(
                      ['docker', 'pull', '--platform', f'linux/{arch}', image],
                      env=env, check=True,
                  )
              except (OSError, subprocess.CalledProcessError):
                  raise SystemExit(
                      'Anonymous full image pull FAILED; publication acceptance remains incomplete. '
                      'No visibility changes or retry push were performed.'
                  ) from None
              subprocess.run(
                  [sys.executable, 'tools/container_smoke.py', '--image', image, '--arch', arch],
                  env=env, check=True,
              )
          PY
